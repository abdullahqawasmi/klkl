<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Neon Breakout</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <canvas id="game" width="880" height="620"></canvas>

    <div class="hud">
      <div>
        Score
        <span class="score-val" id="score">0</span>
      </div>
      <div style="text-align: right;">
        Lives
        <div class="lives" id="lives"></div>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <h1>Breakout</h1>
      <p class="subtitle" id="message">Move the mouse or drag your finger to steer the paddle.<br>Click, tap, or press Space to launch the ball.</p>
      <div class="difficulty" id="difficulty">
        <button class="diff-btn" data-diff="easy">Easy</button>
        <button class="diff-btn active" data-diff="normal">Normal</button>
        <button class="diff-btn" data-diff="hard">Hard</button>
      </div>
      <p class="diff-info" id="diffInfo">1 life · fast ball · steep acceleration</p>
      <button class="btn" id="actionBtn">Play</button>
    </div>
  </div>

<script src="game.js"></script>
</body>
</html>
